# cbindgen config for verl_continuous_token_shim.
#
# Generates include/verl_continuous_token/ffi/tokenizer_shim.h directly from
# this crate's `#[no_mangle] extern "C"` functions -- the C header is never
# hand-written/hand-maintained, so it cannot drift from the real Rust
# signatures (regenerated by build.sh/CMakeLists.txt on every build).

language = "C"
cpp_compat = true
header = """/* AUTO-GENERATED by cbindgen from csrc/continuous_token/rust/src/lib.rs.
 * Do not edit by hand -- regenerated by build.sh / CMakeLists.txt.
 * See csrc/continuous_token/README.md for the C++ wrapper that should be
 * used instead of calling these extern "C" functions directly. */
"""
include_guard = "VERL_CONTINUOUS_TOKEN_FFI_TOKENIZER_SHIM_H"
braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "doxy"

[parse]
parse_deps = false
